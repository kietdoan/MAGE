name: mage
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - setuptools<81  # pyhealth imports pkg_resources
  # NVIDIA GPU environment; requires a CUDA 11.8-compatible host driver.
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - numpy=1.26.*
  - scipy=1.11.*
  # pyhealth 1.1.6 requires pandas < 2.
  - pandas=1.5.3
  - scikit-learn=1.4.*
  - h5py
  - matplotlib=3.9.*
  - pyyaml
  - tqdm
  - pip:
      - pytorch-lightning==2.5.3
      - torchmetrics==1.8.2
      - pyhealth==1.1.6
      - lmdb==1.7.5
      - braindecode==0.8.1
      - einops==0.8.1
      - mne==1.8.0
      - timm==1.0.19
      - tensorboard==2.20.0
